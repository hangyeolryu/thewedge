name: thewedge
description: The Wedge national polling platform for all Koreans.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  cloud_functions: ^5.0.0
  firebase_messaging: ^15.0.0
  firebase_remote_config: ^5.0.0

  # Auth providers
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  kakao_flutter_sdk_user: ^1.9.1

  # State management
  flutter_riverpod: ^2.4.10
  riverpod_annotation: ^2.3.4

  # Navigation
  go_router: ^13.2.0

  # UI
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  fl_chart: ^0.67.0
  shimmer: ^3.0.0
  intl: ^0.19.0
  timeago: ^3.6.1
  lottie: ^3.1.0
  flutter_svg: ^2.0.10+1
  gap: ^3.0.1

  # Deeplinks
  app_links: ^6.1.1

  # Utils
  uuid: ^4.3.3
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.11

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/PretendardVariable.ttf
